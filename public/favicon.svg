<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="civicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#civicGradient)" filter="url(#glow)" />
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Municipal Capitol / Civic Pillars + Pulse Spark -->
  <!-- Pediment / Roof -->
  <path d="M14 26 L32 15 L50 26 Z" fill="#ffffff" />
  
  <!-- Architrave beam -->
  <rect x="15" y="28" width="34" height="3" rx="1.5" fill="#e0f2fe" />

  <!-- 4 Classical Pillars -->
  <rect x="17" y="33" width="4" height="13" rx="1.5" fill="#ffffff" />
  <rect x="25" y="33" width="4" height="13" rx="1.5" fill="#ffffff" />
  <rect x="35" y="33" width="4" height="13" rx="1.5" fill="#ffffff" />
  <rect x="43" y="33" width="4" height="13" rx="1.5" fill="#ffffff" />

  <!-- Base Podium -->
  <rect x="13" y="47" width="38" height="4" rx="2" fill="#ffffff" />

  <!-- Intelligence / Speed Node Badge in Center -->
  <circle cx="32" cy="38" r="4.5" fill="#0284c7" />
  <circle cx="32" cy="38" r="3" fill="#38bdf8" />
  
  <!-- Subtle Sparkle Star -->
  <path d="M48 13 L49.5 17 L53.5 18.5 L49.5 20 L48 24 L46.5 20 L42.5 18.5 L46.5 17 Z" fill="#38bdf8" />
</svg>
